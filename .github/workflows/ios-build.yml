name: iOS Build (validate)

# Remote macOS iteration loop for the Phase 12 iOS target. Two modes:
# - validate (default): compiles UNSIGNED (CODE_SIGNING_ALLOWED=NO) + native
#   tests + simulator boot smoke. No secrets needed.
# - device: development-signed Release IPA for a physical iPhone (needs the 8
#   signing secrets; install from Linux with `xtool install`).
# Dispatch-only — macOS minutes are spent deliberately.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Unsigned validation or a development-signed device IPA
        required: true
        default: validate
        type: choice
        options:
          - validate
          - device

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The iOS pods consume the same workspace install as every other gate
      # (react-native resolves through the pnpm store from the Podfile).
      - run: pnpm install --frozen-lockfile

      # Metro resolves the @cemp/* workspace packages through their
      # "exports" maps, which point at dist/ (tsc output) — without this the
      # boot-smoke bundle fails with "invalid package.json configuration".
      - run: pnpm build

      # Pin Ruby: the macos runner's default Ruby intermittently kills
      # CocoaPods with "pathname contains null byte"
      # (CocoaPods/CocoaPods#12798 — reports say 3.2/3.3 are unaffected).
      # The 3x retry below stays as belt-and-braces.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # The pin alone does nothing without a `pod` installed FOR that Ruby —
      # otherwise PATH falls through to the runner's homebrew CocoaPods,
      # which still runs under 3.4 (observed on run 30202050162: the pinned
      # step was present yet the failure log shows "Ruby : ruby 3.4.10").
      - name: CocoaPods for the pinned Ruby
        run: gem install cocoapods --no-document

      # pod install must run with CWD = apps/android/ios: use_native_modules!
      # shells out to `node -e "...require('@react-native-community/cli')..."`
      # which resolves from the process CWD, and pnpm does not hoist the CLI
      # to the repo-root node_modules.
      - name: CocoaPods install
        working-directory: apps/android/ios
        env:
          # The "null byte" flake is encoding-sensitive (Pathname#realdirpath
          # on globbed paths); CocoaPods requires a UTF-8 locale.
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          set -o pipefail
          # CocoaPods intermittently dies with "pathname contains null byte"
          # in PodsProjectGenerator (upstream flake CocoaPods/CocoaPods#12798,
          # "hit or miss" on the macos runners) — retry with a clean Pods
          # state before giving up.
          for attempt in 1 2 3 4 5; do
            if pod install 2>&1 | tee "$RUNNER_TEMP/pod-install.log"; then
              exit 0
            fi
            echo "pod install failed (attempt $attempt of 5), cleaning Pods state" >&2
            rm -rf Pods Podfile.lock
            # The download cache survives `rm -rf Pods`: a poisoned spec
            # tarball in it makes EVERY retry fail identically (seen
            # 2026-07-28 — 5/5 identical null-byte failures).
            pod cache clean --all 2>/dev/null || rm -rf "$HOME/Library/Caches/CocoaPods"
            sleep 5
          done
          echo "pod install failed after 5 attempts" >&2
          exit 1

      - name: xcodebuild (unsigned, simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace apps/android/ios/CempMobile.xcworkspace \
            -scheme CempMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      # Conformance gate for the CempKdf native module: runs the CempMobileTests
      # XCTest (tools/kdf-c-core/vectors.txt through the module's C core) on a
      # booted iPhone simulator, unsigned.
      - name: xcodebuild test (CempKdf vectors, simulator)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | contains("iPhone"))] | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "Using simulator: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcodebuild test \
            -workspace apps/android/ios/CempMobile.xcworkspace \
            -scheme CempMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      # Boot smoke: the first end-to-end proof the app actually BOOTS on iOS.
      # Metro runs on the runner (the simulator reaches the runner's
      # localhost directly — no adb-reverse equivalent); the Debug build's
      # RCTBundleURLProvider defaults to localhost:8081. Fail conditions are
      # deliberately behavioural, not pixel-based (v1 has no UI automation —
      # the screenshot artifact is for human review): the app process must
      # stay alive, Metro must actually serve the bundle to the app (the
      # T17 F-3 lesson), and no crash signature may appear.
      - name: Metro (background, for boot smoke)
        if: ${{ inputs.mode == 'validate' }}
        working-directory: apps/android
        run: |
          nohup npx react-native start --port 8081 --verbose > "$RUNNER_TEMP/metro.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/metro.pid"
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8081/status" | grep -q "packager-status:running"; then
              echo "Metro is up (pid $(cat "$RUNNER_TEMP/metro.pid"))"
              exit 0
            fi
            sleep 2
          done
          echo "Metro did not come up within 60s" >&2
          tail -50 "$RUNNER_TEMP/metro.log" >&2
          exit 1

      - name: Simulator boot smoke (install, launch, assert)
        if: ${{ inputs.mode == 'validate' }}
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | contains("iPhone"))] | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "Using simulator: $UDID (same device as the test step)"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

          APP=$(ls -d "$HOME"/Library/Developer/Xcode/DerivedData/CempMobile-*/Build/Products/Debug-iphonesimulator/CempMobile.app)
          echo "Installing $APP"
          xcrun simctl install "$UDID" "$APP"

          touch "$RUNNER_TEMP/smoke-marker"
          xcrun simctl launch "$UDID" com.cempmobile

          # Assertion 1: Metro really serves the JS bundle TO THE APP. The
          # request URL is /index.bundle; Metro's own log line is
          # "BUNDLE ./index.js" once bundling starts — accept either.
          bundle_served=0
          for i in $(seq 1 90); do
            if grep -qiE "index\.bundle|BUNDLE +\./index" "$RUNNER_TEMP/metro.log"; then
              bundle_served=1
              echo "Metro received the app's bundle request"
              break
            fi
            sleep 2
          done
          if [ "$bundle_served" != "1" ]; then
            echo "FAIL: Metro never received the app's bundle request" >&2
            tail -30 "$RUNNER_TEMP/metro.log" >&2
            exit 1
          fi

          # A bundle that errors leaves the app on a redbox — that is a boot
          # failure even though the process stays alive.
          if grep -q "ERROR" "$RUNNER_TEMP/metro.log"; then
            echo "FAIL: Metro failed to build the bundle" >&2
            grep -A8 "ERROR" "$RUNNER_TEMP/metro.log" | head -40 >&2
            exit 1
          fi

          # Let the JS settle, then Assertion 2: the process is still alive.
          sleep 15
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q "UIKitApplication:com.cempmobile"; then
            echo "FAIL: app process is not alive after bundle load" >&2
            exit 1
          fi
          echo "App process alive after bundle load + 15s"

          # Assertion 3: no crash signature (fresh crash report, or an
          # uncaught-exception line in the app's system log).
          if find "$HOME/Library/Logs/DiagnosticReports" -name "CempMobile*" -newer "$RUNNER_TEMP/smoke-marker" | grep -q .; then
            echo "FAIL: crash report written since app launch" >&2
            find "$HOME/Library/Logs/DiagnosticReports" -name "CempMobile*" -newer "$RUNNER_TEMP/smoke-marker" >&2
            exit 1
          fi
          xcrun simctl spawn "$UDID" log show --last 10m --style compact \
            --predicate 'process == "CempMobile"' > "$RUNNER_TEMP/sim-app.log" 2>&1 || true
          if grep -q "Terminating app due to uncaught exception" "$RUNNER_TEMP/sim-app.log"; then
            echo "FAIL: uncaught-exception signature in the app log" >&2
            grep -B2 -A5 "Terminating app due to uncaught exception" "$RUNNER_TEMP/sim-app.log" >&2
            exit 1
          fi

          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/smoke.png"
          echo "Boot smoke PASSED (screenshot at $RUNNER_TEMP/smoke.png)"

      # ── device mode: development-signed Release IPA for a physical iPhone ──

      - name: Verify signing secrets
        if: ${{ inputs.mode == 'device' }}
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          missing=0
          for name in ASC_TEAM_ID BUILD_CERTIFICATE_BASE64 P12_PASSWORD \
            PROVISIONING_PROFILE_BASE64 PROVISIONING_PROFILE_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "Missing repository secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Import development certificate
        if: ${{ inputs.mode == 'device' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/development.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        if: ${{ inputs.mode == 'device' }}
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIRECTORY"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D \
            > "$PROFILE_DIRECTORY/cempmobile-dev.mobileprovision"

      - name: Archive (Release, development-signed)
        if: ${{ inputs.mode == 'device' }}
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace apps/android/ios/CempMobile.xcworkspace \
            -scheme CempMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CempMobile.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Development' \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" 2>&1 | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Export device IPA
        if: ${{ inputs.mode == 'device' }}
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -o pipefail
          PLIST=/usr/libexec/PlistBuddy
          cp apps/android/ios/ExportOptions-dev.plist "$RUNNER_TEMP/ExportOptions.plist"
          "$PLIST" -c "Add :teamID string $ASC_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          "$PLIST" -c 'Add :provisioningProfiles dict' "$RUNNER_TEMP/ExportOptions.plist"
          "$PLIST" -c "Add :provisioningProfiles:com.cempmobile string $PROVISIONING_PROFILE_NAME" \
            "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CempMobile.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates 2>&1 | tee "$RUNNER_TEMP/xcodebuild-export.log"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload device IPA
        if: ${{ inputs.mode == 'device' }}
        uses: actions/upload-artifact@v7
        with:
          name: cempmobile-dev-${{ github.run_number }}.ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/pod-install.log
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/metro.log
            ${{ runner.temp }}/sim-app.log
            ${{ runner.temp }}/smoke.png
            ${{ runner.temp }}/xcodebuild-archive.log
            ${{ runner.temp }}/xcodebuild-export.log
          if-no-files-found: warn
          retention-days: 14
